name: Build LMG OS ISO
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-lmg-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Customization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage squashfs-tools syslinux-utils curl xorriso

      - name: Download and Process Official Debian 13
        run: |
          # ۱. دانلود هوشمند فایل واقعی دبیان ۱۳ با هویت شبیه‌سازی شده مرورگر
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o debian-raw.iso https://debian.org
          
          # ۲. استخراج فایل‌های ISO
          mkdir -p iso-extract
          xorriso -osirrox on -indev debian-raw.iso -extract / iso-extract
          chmod -R +w iso-extract
          
          # ۳. تزریق پکیج‌های درخواستی LMG OS
          mkdir -p iso-extract/install
          echo "xfce4 xfce4-goodies thunar firefox-esr vlc libmtp9 mtp-tools gvfs-mtp cups bluez" > iso-extract/install/lmg_packages.txt

          # ۴. ساخت فایل ISO استاندارد بدون نیاز به کاتالوگ سخت‌گیرانه
          sudo mkisofs -o LMG-OS-1.0.0-amd64.iso \
            -R -J -v -V "LMG_OS_1" iso-extract/
            
      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "LMG OS 1.0.0 Stable Release"
          files: LMG-OS-1.0.0-amd64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
