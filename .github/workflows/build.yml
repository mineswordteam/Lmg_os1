name: Build LMG OS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build ISO Image via BlueBuild
        uses: blue-build/github-action@v1
        with:
          recipe: 'recipe.yml'
          cosign_private_key: "" # غیرفعال کردن امضای امنیتی برای رفع ارور

      - name: Upload ISO to Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "LMG OS 1.0.0 Release"
          files: |
            ./*.iso
            ./output/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
